name: Mod catalog
on:
  pull_request:
    paths: ['catalog/**', '.github/workflows/mod-catalog.yml']
  push:
    branches: [main]
    paths: ['catalog/**', '.github/workflows/mod-catalog.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag'
        type: string
        required: true
      content_ref:
        description: 'Content ref (blank uses release tag; historical migration uses merged content commit)'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  catalog:
    uses: joshua-small/qsys-mod-manager/.github/workflows/publish-mod-catalog.yml@a70e7273e6786ed2ae163c81267f73131e0612bc
    with:
      tool_revision: a70e7273e6786ed2ae163c81267f73131e0612bc
      tag: ${{ github.event.release.tag_name || inputs.tag || '' }}
      content_ref: ${{ inputs.content_ref || '' }}
      publish: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
